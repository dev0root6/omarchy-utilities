# ASCII gallery screensaver: generative paintings as live ASCII art on Ctrl+L
# (note: a global bind swallows Ctrl+L in every app, e.g. clear-screen, browser address bar)
bindd = CTRL, L, ASCII gallery screensaver, exec, uwsm-app -- kitty --class ascii-gallery --start-as=fullscreen -o font_size=9 -o background=black -o background_opacity=1 -o window_padding_width=0 -o confirm_os_window_close=0 python3 /home/dev0root/ascii-gallery/gallery.py
windowrule = fullscreen on, match:class ^(ascii-gallery)$
windowrule = opacity 1 1 override, match:class ^(ascii-gallery)$

# Fan speed (nbfc-linux, see ~/.local/bin/fan-speed)
bindd = SUPER ALT, EQUAL, Fan speed up, exec, /home/dev0root/.local/bin/fan-speed up
bindd = SUPER ALT, MINUS, Fan speed down, exec, /home/dev0root/.local/bin/fan-speed down
bindd = SUPER ALT, M, Fan speed menu, exec, /home/dev0root/.local/bin/fan-speed menu

# Nothing-style system dashboard (web UI on 127.0.0.1:47800)
bindd = SUPER ALT, I, System dashboard, exec, /home/dev0root/.local/bin/nothing-dash
